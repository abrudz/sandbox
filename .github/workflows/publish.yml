name: Publish

# Publishes ghcr.io/<repository>:latest and :<dyalog-version> from main:
# on every push, and daily when docker.io/dyalog/dyalog:latest has moved
# since the published image was built or that image is a week old.
# image.yml builds and tests the image; the publish job, the only one that
# can write packages, pushes it only once every suite has passed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: Build only if the upstream image has changed since the published image was built, or that image is a week old, as the daily run does
        type: boolean
        default: false
      upstream:
        description: Build and test from this image instead of docker.io/dyalog/dyalog:latest; such a run never publishes
        type: string
        default: ""

permissions:
  contents: read

# One run at a time, so two publishes never interleave; a queued run waits
# rather than cancelling the one in progress.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      digest: ${{ steps.decide.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to build
        id: decide
        env:
          DAILY: ${{ github.event_name == 'schedule' || inputs.daily == true }}
          UPSTREAM: ${{ inputs.upstream || 'docker.io/dyalog/dyalog:latest' }}
          PUBLISHED_IMAGE: ghcr.io/${{ github.repository }}:latest
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(scripts/resolve-digest "$UPSTREAM")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM is $digest."
          if [ "$DAILY" = true ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            built_from=$(scripts/published-base-digest "$PUBLISHED_IMAGE")
            created=$(scripts/published-created "$PUBLISHED_IMAGE")
            if ! scripts/needs-build "$digest" "$built_from" "$created"; then
              echo "::notice::Nothing to publish."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  image:
    name: Image
    needs: check
    if: needs.check.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    with:
      upstream: ${{ inputs.upstream }}
      digest: ${{ needs.check.outputs.digest }}

  publish:
    name: Publish
    needs: [check, image]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    # The only job that can write packages. It runs nothing from the
    # repository or the suites' dependencies: it loads the image the build
    # job saved, checks it is the one the suites passed, and pushes it.
    permissions:
      packages: write
    env:
      SANDBOX_IMAGE: sandbox:ci
      # Only main publishes, and never from an overridden upstream image;
      # elsewhere the job stops before logging in.
      PUBLISH: ${{ (inputs.upstream || '') == '' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandbox-image

      - name: Load image
        env:
          IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          zstd -dc sandbox-image.tar.zst | docker load
          loaded=$(docker image inspect -f '{{.Id}}' "$SANDBOX_IMAGE")
          if [ "$loaded" != "$IMAGE_ID" ]; then
            echo "::error::The artifact holds $loaded, not the image the build job built and the suites passed, $IMAGE_ID."
            exit 1
          fi
          echo "Loaded $IMAGE_ID."

      - name: Push
        if: env.PUBLISH == 'true'
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$SANDBOX_IMAGE")
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in latest "$version"; do
            docker tag "$SANDBOX_IMAGE" "$REPOSITORY:$tag"
            docker push "$REPOSITORY:$tag"
          done
          echo "::notice::Published $REPOSITORY:latest and $REPOSITORY:$version"

      - name: Report a run that does not publish
        if: env.PUBLISH != 'true'
        run: echo "::notice::Checked the image; only main publishes, and never from an overridden upstream image."
