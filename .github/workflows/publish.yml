name: Publish

# Publishes ghcr.io/<repository>:latest and :<dyalog-version> from main:
# on every push, and daily when docker.io/dyalog/dyalog:latest has moved
# since the published image was built. image.yml tests every image before
# pushing it, so a failing suite fails the run and publishes nothing.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: Build only if the upstream image has changed since the published image was built, as the daily run does
        type: boolean
        default: false
      upstream:
        description: Build and test from this image instead of docker.io/dyalog/dyalog:latest; such a run never publishes
        type: string
        default: ""

permissions:
  contents: read

# One run at a time, so two publishes never interleave; a queued run waits
# rather than cancelling the one in progress.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      digest: ${{ steps.decide.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build
        id: decide
        env:
          DAILY: ${{ github.event_name == 'schedule' || inputs.daily == true }}
          UPSTREAM: ${{ inputs.upstream || 'docker.io/dyalog/dyalog:latest' }}
          PUBLISHED_IMAGE: ghcr.io/${{ github.repository }}:latest
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(scripts/resolve-digest "$UPSTREAM")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM is $digest."
          if [ "$DAILY" = true ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            built_from=$(scripts/published-base-digest "$PUBLISHED_IMAGE")
            if [ "$built_from" = "$digest" ]; then
              echo "::notice::$PUBLISHED_IMAGE was built from $digest; nothing to publish."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$PUBLISHED_IMAGE was built from ${built_from:-an unknown digest}."
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  image:
    name: Image
    needs: check
    if: needs.check.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      upstream: ${{ inputs.upstream }}
      digest: ${{ needs.check.outputs.digest }}
      # Only main publishes, and never from an overridden upstream image.
      publish: ${{ (inputs.upstream || '') == '' && github.ref == 'refs/heads/main' }}
