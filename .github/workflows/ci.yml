name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    # Pushes to this repository already run CI; pull_request runs cover forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags deploy ./...

      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 -tags integration ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 -tags deploy ./...

      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files -- image scripts deploy | xargs -r grep -lE '^#!.*\b(ba|da)?sh\b' || true)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts to check."
            exit 0
          fi
          shellcheck "${scripts[@]}"

      - name: Unit tests
        run: go test -count=1 ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 26

      - name: Frontend scripts
        if: ${{ !cancelled() }}
        run: |
          for f in web/*.js; do node --check "$f"; done
          node --test test/ui/codec.test.js

  image:
    name: Image and integration tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/image.yml

  deploy:
    name: Deployment
    needs: image
    # The image job's build output is enough: the deployment is tested even
    # when the integration or UI suites fail.
    if: ${{ !cancelled() && needs.image.outputs.image-id != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04
    # The runner stands in for the public instance's VM: deploy/setup-host
    # provisions it, with Caddy serving plain HTTP on localhost and the
    # image coming from a local registry the update test can publish to.
    # The image is this run's candidate, the one publishing would push, so
    # that deploy/ and the image are tested together as they will run.
    env:
      SITE_ADDRESS: http://localhost
      SANDBOX_IMAGE: localhost:5000/sandbox:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandbox-image

      - name: Publish the candidate image to a local registry
        env:
          IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          zstd -dc sandbox-image.tar.zst | docker load
          rm sandbox-image.tar.zst
          if [ "$(docker image inspect -f '{{.Id}}' sandbox:ci)" != "$IMAGE_ID" ]; then
            echo "::error::The artifact does not hold the image the build job built, $IMAGE_ID."
            exit 1
          fi
          docker run -d --name registry -p 127.0.0.1:5000:5000 docker.io/library/registry:2
          docker tag sandbox:ci "$SANDBOX_IMAGE"
          docker push "$SANDBOX_IMAGE"

      - name: Provision this runner as the public instance
        run: sudo --preserve-env=SITE_ADDRESS,SANDBOX_IMAGE deploy/setup-host

      - name: Deployment tests
        if: ${{ !cancelled() }}
        run: sudo --preserve-env=SITE_ADDRESS,SANDBOX_IMAGE "$(command -v go)" test -tags deploy -count=1 -v ./test/deploy/...
