# The public instance: the sandbox behind Caddy. deploy/setup-host installs
# this file as /opt/sandbox/compose.yaml, beside the Caddyfile, seccomp.json
# and an .env file that sets SITE_ADDRESS, SANDBOX_IMAGE and the sandbox
# container's limits.
name: sandbox

services:
  sandbox:
    image: ${SANDBOX_IMAGE}
    # nsjail creates namespaces, mounts and cgroups for every run; README.md
    # says what each of these grants it. No other capability is needed.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - apparmor=unconfined
      - systempaths=unconfined
      # Docker's default seccomp profile with pivot_root allowed, read when
      # the container is created.
      - seccomp=./seccomp.json
    # The entry point changes the cgroup at the root of its namespace, which
    # must be the container's own whatever the daemon's default.
    cgroup: private
    # deploy/setup-host derives these from the VM's memory and CPUs: the
    # host keeps 512 MiB beyond the container's limit, and the container's
    # concurrent runs fit within it.
    mem_limit: ${SANDBOX_MEMORY_LIMIT}
    memswap_limit: ${SANDBOX_MEMORY_LIMIT}
    pids_limit: ${SANDBOX_PIDS_LIMIT}
    restart: unless-stopped
    # Longer than a run's time limit plus the time it takes to stop, so that
    # replacing the container lets its runs in progress finish.
    stop_grace_period: 30s
    # No network but loopback: nothing in the container connects out, and
    # runs have network namespaces of their own. runner-api serves Caddy on
    # a Unix socket in the volume the two share, open to root only, so its
    # X-Forwarded-For header names the client.
    network_mode: none
    environment:
      SANDBOX_SOCKET: /run/sandbox/runner-api.sock
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY}
    volumes:
      - runner-api-socket:/run/sandbox
    logging:
      driver: local

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    # On the host network Caddy sees clients' own addresses, over IPv4 and
    # IPv6, and passes them on in X-Forwarded-For.
    network_mode: host
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - runner-api-socket:/run/sandbox
    logging:
      driver: local

volumes:
  caddy-data:
  caddy-config:
  runner-api-socket:
