// Installed by deploy/setup-host as
// /etc/apt/apt.conf.d/60sandbox-unattended-upgrades. Upgrades are
// installed daily, and the host reboots when one needs it, so kernel fixes
// take effect; the instance restarts with Docker.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
Unattended-Upgrade::Automatic-Reboot "true";
// Before the daily publish and update, in the host's time zone (UTC on
// cloud images).
Unattended-Upgrade::Automatic-Reboot-Time "03:30";
