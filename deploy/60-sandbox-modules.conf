# Installed by deploy/setup-host as /etc/modprobe.d/60-sandbox-modules.conf.
#
# Socket protocol and family modules this host has no use for. The kernel
# loads one when a process asks for its protocol or family, or for 8021q's
# socket ioctls, with no capability check. The jail's seccomp policy refuses
# those requests; this file refuses the modules themselves, so that a gap in
# the policy cannot bring their code into the kernel. "install ... /bin/false"
# makes every load fail, an explicit modprobe included. Docker, the firewall
# and the VM's own networking use none of these.

# IP protocols: socket(AF_INET or AF_INET6, type, protocol).
install sctp /bin/false
install dccp /bin/false
install dccp_ipv4 /bin/false
install dccp_ipv6 /bin/false
install l2tp_ip /bin/false
install l2tp_ip6 /bin/false
install smc /bin/false

# Address families: socket(family, ...) and socketpair(family, ...).
install af_key /bin/false
install appletalk /bin/false
install atm /bin/false
install ax25 /bin/false
install bluetooth /bin/false
install caif_socket /bin/false
install can /bin/false
install ieee802154_socket /bin/false
install kcm /bin/false
install llc2 /bin/false
install netrom /bin/false
install nfc /bin/false
install phonet /bin/false
install qrtr /bin/false
install rds /bin/false
install rose /bin/false
install rxrpc /bin/false
install tipc /bin/false
install x25 /bin/false

# VLANs: the SIOCGIFVLAN and SIOCSIFVLAN socket ioctls.
install 8021q /bin/false
