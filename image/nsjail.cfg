# nsjail configuration for one Dyalog APL run (protobuf text format; schema:
# config.proto in nsjail 3.6). runner-api adds the per-run directory with
# --bindmount_ro <dir>:/job and the command line after --.

name: "dyalog-run"
mode: ONCE
hostname: "sandbox"
cwd: "/home/run"

# runner-api enforces the configured wall-clock limit itself and passes
# --time_limit a little above it as a backstop; this value applies only to
# nsjail started without that flag.
time_limit: 10

# runner-api reads this log to learn how the jailed process ended; see
# internal/sandbox/nsjail.go.
log_fd: 3
log_level: INFO

keep_env: false
envar: "HOME=/home/run"
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "LANG=C.UTF-8"
envar: "MAXWS=256M"

# nsjail's defaults allow 32 open files and 1 MiB written per file.
rlimit_nofile: 256
rlimit_fsize: 16
rlimit_core: 0

# The jailed user is uid/gid 99999 inside the jail and outside it, never
# root outside.
uidmap {
  inside_id: "99999"
  outside_id: "99999"
  count: 1
}
gidmap {
  inside_id: "99999"
  outside_id: "99999"
  count: 1
}

# The jail starts from an empty root; only the paths below exist.
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
}
mount {
  src: "/usr/bin"
  dst: "/bin"
  is_symlink: true
}
mount {
  src: "/usr/sbin"
  dst: "/sbin"
  is_symlink: true
}
mount {
  src: "/usr/lib"
  dst: "/lib"
  is_symlink: true
}
mount {
  src: "/usr/lib64"
  dst: "/lib64"
  is_symlink: true
  mandatory: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
}
mount {
  src: "/opt/mdyalog"
  dst: "/opt/mdyalog"
  is_bind: true
}
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  options: "size=16m,mode=1777"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}
mount {
  dst: "/home/run"
  fstype: "tmpfs"
  options: "size=16m,mode=1777"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}
mount {
  dst: "/proc"
  fstype: "proc"
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
}
mount {
  src: "/proc/self/fd"
  dst: "/dev/fd"
  is_symlink: true
}
