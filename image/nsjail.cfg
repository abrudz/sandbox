# nsjail configuration for one Dyalog APL run (protobuf text format; schema:
# config.proto in the nsjail commit image/Containerfile pins). runner-api
# adds the per-run directory with --bindmount_ro <dir>:/job, the per-run
# limits (time, cgroup memory, CPU and processes, MAXWS) and the command
# line after --.

name: "dyalog-run"
mode: ONCE
hostname: "sandbox"
cwd: "/home/run"

# runner-api enforces the configured wall-clock limit itself and passes
# --time_limit a little above it as a backstop; this value applies only to
# nsjail started without that flag.
time_limit: 10

# runner-api reads this log to learn how the jailed process ended; see
# internal/sandbox/nsjail.go.
log_fd: 3
log_level: INFO

keep_env: false
envar: "HOME=/home/run"
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "LANG=C.UTF-8"
# The interpreter finds the .NET runtime, which the base image installs in
# /opt/dotnet, through DOTNET_ROOT. With diagnostics off the runtime creates
# no diagnostics socket or debugger pipes in /tmp and accepts no debugger or
# profiler. runner-api adds the heap limit (DOTNET_GCHeapHardLimit).
envar: "DOTNET_ROOT=/opt/dotnet"
envar: "DOTNET_EnableDiagnostics=0"

# nsjail's defaults allow 32 open files and 1 MiB written per file.
rlimit_nofile: 256
rlimit_fsize: 16
rlimit_core: 0

# Each run gets its own cgroup below the container's, whose controllers
# image/entrypoint delegates.
use_cgroupv2: true

# Kafel policy (the pinned nsjail commit's revision). User code reaches any
# system call through ⎕NA, so the calls a sandboxed program has no use for
# fail with EPERM: namespaces and mounts, clone with a namespace flag,
# tracing and other processes' memory, BPF, perf, kernel keys, userfaultfd,
# io_uring, kernel modules and kexec, clocks, swap, reboot, file handles,
# fanotify, the LDT, vmsplice, NUMA page placement and similar.
# Socket calls fail where they could make the kernel load a module, which
# it does with no capability check, bringing rarely exercised code into the
# kernel every run shares: socket in a family other than Unix, IPv4 and
# IPv6, or in IPv4 or IPv6 with a protocol other than the default, TCP and
# UDP; socketpair in any family but Unix, since it creates its sockets as
# socket does; and the socket ioctls that load bridge (SIOCGIFBR,
# SIOCSIFBR, SIOCBRADDBR, SIOCBRDELBR, SIOCBRADDIF, SIOCBRDELIF) and 8021q
# (SIOCGIFVLAN, SIOCSIFVLAN). The TCP_ULP socket option, which attaches an
# upper-layer protocol such as kernel TLS, loads a module only under
# CAP_NET_ADMIN, but fails too, so that no run reaches one the host has
# loaded. Docker's seccomp profile is no second filter for many of these:
# it covers the whole container, so it allows nsjail's calls, such as those
# under CAP_SYS_ADMIN, to the jail too.
# clone3 passes its flags in memory, which a filter cannot read; ENOSYS
# makes the C library fall back to clone, whose flags are checked.
seccomp_string: "ERRNO(1) {"
seccomp_string: "  unshare, setns, mount, umount, pivot_root, chroot,"
seccomp_string: "  fsopen, fsconfig, fsmount, fspick, move_mount, open_tree, mount_setattr,"
seccomp_string: "  clone { (clone_flags & 0x7e020000) != 0 },"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, pidfd_getfd,"
seccomp_string: "  bpf, perf_event_open, userfaultfd,"
seccomp_string: "  io_uring_setup, io_uring_enter, io_uring_register,"
seccomp_string: "  keyctl, add_key, request_key,"
seccomp_string: "  init_module, finit_module, delete_module, kexec_load, kexec_file_load,"
seccomp_string: "  open_by_handle_at, name_to_handle_at, lookup_dcookie, quotactl, acct,"
seccomp_string: "  syslog, vhangup, fanotify_init, modify_ldt, vmsplice,"
seccomp_string: "  mbind, migrate_pages, move_pages,"
seccomp_string: "  swapon, swapoff, reboot, iopl, ioperm,"
seccomp_string: "  settimeofday, clock_settime, clock_adjtime, adjtimex,"
seccomp_string: "  setsockopt { level == 6 && optname == 31 },"
seccomp_string: "  socket { family != 1 && family != 2 && family != 10 },"
seccomp_string: "  socket { (family == 2 || family == 10) && protocol != 0 && protocol != 6 && protocol != 17 },"
seccomp_string: "  socketpair { family != 1 },"
seccomp_string: "  ioctl { cmd == 0x8940 || cmd == 0x8941 || cmd == 0x89a0 || cmd == 0x89a1 ||"
seccomp_string: "    cmd == 0x89a2 || cmd == 0x89a3 || cmd == 0x8982 || cmd == 0x8983 }"
seccomp_string: "}"
seccomp_string: "ERRNO(38) { clone3 }"
seccomp_string: "DEFAULT ALLOW"

# The jailed user is uid/gid 99999 inside the jail and outside it, never
# root outside.
uidmap {
  inside_id: "99999"
  outside_id: "99999"
  count: 1
}
gidmap {
  inside_id: "99999"
  outside_id: "99999"
  count: 1
}

# The jail starts from an empty root; only the paths below exist.
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
}
mount {
  src: "/usr/bin"
  dst: "/bin"
  is_symlink: true
}
mount {
  src: "/usr/sbin"
  dst: "/sbin"
  is_symlink: true
}
mount {
  src: "/usr/lib"
  dst: "/lib"
  is_symlink: true
}
mount {
  src: "/usr/lib64"
  dst: "/lib64"
  is_symlink: true
  mandatory: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
}
mount {
  src: "/opt/mdyalog"
  dst: "/opt/mdyalog"
  is_bind: true
}
mount {
  src: "/opt/dotnet"
  dst: "/opt/dotnet"
  is_bind: true
}
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  options: "size=16m,mode=1777"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}
mount {
  dst: "/home/run"
  fstype: "tmpfs"
  options: "size=16m,mode=1777"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}
mount {
  dst: "/proc"
  fstype: "proc"
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
}
mount {
  src: "/proc/self/fd"
  dst: "/dev/fd"
  is_symlink: true
}
