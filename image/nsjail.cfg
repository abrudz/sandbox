# nsjail configuration for one Dyalog APL run (protobuf text format; schema:
# config.proto in nsjail 3.6). runner-api adds the per-run directory with
# --bindmount_ro <dir>:/job, the per-run limits (time, cgroup memory, CPU
# and processes, MAXWS) and the command line after --.

name: "dyalog-run"
mode: ONCE
hostname: "sandbox"
cwd: "/home/run"

# runner-api enforces the configured wall-clock limit itself and passes
# --time_limit a little above it as a backstop; this value applies only to
# nsjail started without that flag.
time_limit: 10

# runner-api reads this log to learn how the jailed process ended; see
# internal/sandbox/nsjail.go.
log_fd: 3
log_level: INFO

keep_env: false
envar: "HOME=/home/run"
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "LANG=C.UTF-8"

# nsjail's defaults allow 32 open files and 1 MiB written per file.
rlimit_nofile: 256
rlimit_fsize: 16
rlimit_core: 0

# Each run gets its own cgroup below the container's, whose controllers
# image/entrypoint delegates.
use_cgroupv2: true

# Kafel policy (the revision bundled with nsjail 3.6). User code reaches any
# system call through ⎕NA, so the calls a sandboxed program has no use for
# fail with EPERM: namespaces and mounts, clone with a namespace flag,
# tracing and other processes' memory, BPF, perf, kernel keys, userfaultfd,
# io_uring, kernel modules and kexec, clocks, swap, reboot and similar.
# clone3 passes its flags in memory, which a filter cannot read; ENOSYS
# makes the C library fall back to clone, whose flags are checked.
seccomp_string: "ERRNO(1) {"
seccomp_string: "  unshare, setns, mount, umount, pivot_root, chroot,"
seccomp_string: "  fsopen, fsconfig, fsmount, fspick, move_mount, open_tree, mount_setattr,"
seccomp_string: "  clone { (clone_flags & 0x7e020000) != 0 },"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, pidfd_getfd,"
seccomp_string: "  bpf, perf_event_open, userfaultfd,"
seccomp_string: "  io_uring_setup, io_uring_enter, io_uring_register,"
seccomp_string: "  keyctl, add_key, request_key,"
seccomp_string: "  init_module, finit_module, delete_module, kexec_load, kexec_file_load,"
seccomp_string: "  open_by_handle_at, lookup_dcookie, quotactl, acct, syslog, vhangup,"
seccomp_string: "  swapon, swapoff, reboot, iopl, ioperm,"
seccomp_string: "  settimeofday, clock_settime, clock_adjtime, adjtimex"
seccomp_string: "}"
seccomp_string: "ERRNO(38) { clone3 }"
seccomp_string: "DEFAULT ALLOW"

# The jailed user is uid/gid 99999 inside the jail and outside it, never
# root outside.
uidmap {
  inside_id: "99999"
  outside_id: "99999"
  count: 1
}
gidmap {
  inside_id: "99999"
  outside_id: "99999"
  count: 1
}

# The jail starts from an empty root; only the paths below exist.
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
}
mount {
  src: "/usr/bin"
  dst: "/bin"
  is_symlink: true
}
mount {
  src: "/usr/sbin"
  dst: "/sbin"
  is_symlink: true
}
mount {
  src: "/usr/lib"
  dst: "/lib"
  is_symlink: true
}
mount {
  src: "/usr/lib64"
  dst: "/lib64"
  is_symlink: true
  mandatory: false
}
mount {
  src: "/etc"
  dst: "/etc"
  is_bind: true
}
mount {
  src: "/opt/mdyalog"
  dst: "/opt/mdyalog"
  is_bind: true
}
mount {
  dst: "/tmp"
  fstype: "tmpfs"
  options: "size=16m,mode=1777"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}
mount {
  dst: "/home/run"
  fstype: "tmpfs"
  options: "size=16m,mode=1777"
  rw: true
  nosuid: true
  nodev: true
  noexec: true
}
mount {
  dst: "/proc"
  fstype: "proc"
}
mount {
  src: "/dev/null"
  dst: "/dev/null"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/zero"
  dst: "/dev/zero"
  is_bind: true
  rw: true
}
mount {
  src: "/dev/urandom"
  dst: "/dev/urandom"
  is_bind: true
}
mount {
  src: "/proc/self/fd"
  dst: "/dev/fd"
  is_symlink: true
}
